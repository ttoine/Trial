<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sudoku Zen PWA</title>
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIlN1ZG9rdSBaZW4iLAogICJzaG9ydF9uYW1lIjogIlN1ZG9rdSIsCiAgInN0YXJ0X3VybCI6ICIuIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjZmZmZmZmIiwKICAidGhlbWVfY29sb3IiOiAiIzRhOTBlZCIKfQ==">
    <style>
        :root {
            --bg: #f0f2f5;
            --cell-bg: #ffffff;
            --text: #333;
            --primary: #4a90e2;
            --selected: #d1e4f9;
            --error: #ffcfcf;
            --border: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: manipulation;
        }

        h1 { margin: 15px 0; color: var(--primary); }

        .controls { margin-bottom: 15px; }
        select { padding: 8px; border-radius: 5px; border: 1px solid #ccc; font-size: 1rem; }

        /* Grille Sudoku */
        #grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            width: 95vw;
            max-width: 400px;
            border: 2px solid var(--border);
            background-color: var(--border);
            gap: 1px;
        }

        .cell {
            background: var(--cell-bg);
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text);
        }

        .cell.fixed { color: #888; background: #f9f9f9; }
        .cell.selected { background: var(--selected) !important; }
        .cell.wrong { background: var(--error); color: red; }

        /* Bordures de blocs 3x3 */
        .cell:nth-child(3n) { border-right: 2px solid var(--border); }
        .cell:nth-child(9n) { border-right: none; }
        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid var(--border); }

        /* Pavé numérique */
        .numpad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: 95vw;
            max-width: 400px;
            margin-top: 20px;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 0;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            active: opacity 0.7;
        }

        .btn.delete { background: #e74c3c; }
    </style>
</head>
<body>

    <h1>Sudoku Zen</h1>

    <div class="controls">
        <select id="difficulty">
            <option value="easy">Facile</option>
            <option value="medium" selected>Moyen</option>
            <option value="hard">Difficile</option>
        </select>
        <button class="btn" style="padding: 8px 15px" onclick="initGame()">Nouveau</button>
    </div>

    <div id="grid"></div>

    <div class="numpad">
        <button class="btn" onclick="inputValue(1)">1</button>
        <button class="btn" onclick="inputValue(2)">2</button>
        <button class="btn" onclick="inputValue(3)">3</button>
        <button class="btn" onclick="inputValue(4)">4</button>
        <button class="btn" onclick="inputValue(5)">5</button>
        <button class="btn" onclick="inputValue(6)">6</button>
        <button class="btn" onclick="inputValue(7)">7</button>
        <button class="btn" onclick="inputValue(8)">8</button>
        <button class="btn" onclick="inputValue(9)">9</button>
        <button class="btn delete" onclick="inputValue(null)">✕</button>
    </div>

<script>
    let selectedCell = null;
    let solution = [];
    let board = [];

    // Générateur simplifié de Sudoku
    function generateSudoku(difficulty) {
        // Pour cet exemple, une grille pré-remplie simple (mélangée normalement par un algorithme)
        // Ici, on utilise un template de base pour la démo
        const base = [
            [5,3,4,6,7,8,9,1,2],[6,7,2,1,9,5,3,4,8],[1,9,8,3,4,2,5,6,7],
            [8,5,9,7,6,1,4,2,3],[4,2,6,8,5,3,7,9,1],[7,1,3,9,2,4,8,5,6],
            [9,6,1,5,3,7,2,8,4],[2,8,7,4,1,9,6,3,5],[3,4,5,2,8,6,1,7,9]
        ];
        
        solution = JSON.parse(JSON.stringify(base));
        board = JSON.parse(JSON.stringify(base));

        let attempts = { 'easy': 30, 'medium': 45, 'hard': 55 }[difficulty];
        
        while(attempts > 0) {
            let r = Math.floor(Math.random() * 9);
            let c = Math.floor(Math.random() * 9);
            if(board[r][c] !== null) {
                board[r][c] = null;
                attempts--;
            }
        }
    }

    function drawGrid() {
        const gridEl = document.getElementById('grid');
        gridEl.innerHTML = '';
        for(let r=0; r<9; r++) {
            for(let c=0; c<9; c++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                if(board[r][c] !== null) {
                    cell.innerText = board[r][c];
                    cell.classList.add('fixed');
                }
                cell.dataset.r = r;
                cell.dataset.c = c;
                cell.onclick = () => {
                    document.querySelectorAll('.cell').forEach(el => el.classList.remove('selected'));
                    cell.classList.add('selected');
                    selectedCell = {r, c, el: cell};
                };
                gridEl.appendChild(cell);
            }
        }
    }

    function inputValue(val) {
        if(!selectedCell || selectedCell.el.classList.contains('fixed')) return;
        
        const {r, c, el} = selectedCell;
        if(val === null) {
            el.innerText = '';
            el.classList.remove('wrong');
            return;
        }

        el.innerText = val;
        if(val !== solution[r][c]) {
            el.classList.add('wrong');
        } else {
            el.classList.remove('wrong');
            checkWin();
        }
    }

    function checkWin() {
        const cells = document.querySelectorAll('.cell');
        const win = Array.from(cells).every(c => c.innerText != '' && !c.classList.contains('wrong'));
        if(win) alert("Félicitations ! Vous avez gagné !");
    }

    function initGame() {
        const diff = document.getElementById('difficulty').value;
        generateSudoku(diff);
        drawGrid();
    }

    // Enregistrement du Service Worker pour le offline (Optionnel mais recommandé)
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
    }

    initGame();
</script>
</body>
</html>
