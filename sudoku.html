    <style>
        :root {
            --bg: #f8f9fa;
            --cell-bg: #ffffff;
            --text: #2d3436;
            --primary: #0984e3;
            --highlight: #e1f5fe;
            --selected: #81d4fa;
            --error: #ff7675;
            --border: #2d3436;
            --note-color: #636e72;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        h1 { margin: 10px 0; color: var(--primary); font-size: 1.5rem; }

        .top-bar { margin-bottom: 10px; display: flex; gap: 10px; }
        select { padding: 5px; border-radius: 5px; }

        /* Grille Sudoku */
        #grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            width: 98vw;
            max-width: 420px;
            border: 2px solid var(--border);
            background-color: var(--border);
            gap: 1px;
        }

        .cell {
            background: var(--cell-bg);
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            font-size: 1.4rem;
            font-weight: bold;
        }

        .cell.fixed { color: #b2bec3; background: #f1f2f6; }
        .cell.highlighted { background: var(--highlight); }
        .cell.selected { background: var(--selected) !important; }
        .cell.wrong { color: #d63031; background: #fab1a0; }

        /* Bordures de blocs 3x3 */
        .cell:nth-child(3n) { border-right: 2px solid var(--border); }
        .cell:nth-child(9n) { border-right: none; }
        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid var(--border); }

        /* Style des Notes */
        .notes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .note {
            font-size: 0.6rem;
            color: var(--note-color);
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        /* Pavé numérique et contrôles */
        .numpad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            width: 95vw;
            max-width: 400px;
            margin-top: 15px;
        }

        .btn {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 12px 0;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            touch-action: manipulation;
        }
        .btn.active { background: var(--primary); color: white; }
        .btn.special { background: #636e72; color: white; border-color: #636e72; }
    </style>
</head>
